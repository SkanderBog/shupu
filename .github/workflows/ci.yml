name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    env:
      # The tests never launch Electron; downloading its ~100 MB binary on
      # every runner only slows the matrix down and adds a network failure.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Upload the single-file build
        if: runner.os == 'Linux' && matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: shupu-single-file
          path: 数谱-简谱工作台-1.0.html
          if-no-files-found: error
          retention-days: 7
